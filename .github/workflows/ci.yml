name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.6.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra traceframe
      - run: uv run --locked --extra traceframe ruff check .
      - run: uv run --locked --extra traceframe ruff format --check .
      - run: uv run --locked --extra traceframe mypy
      - run: uv run --locked --extra traceframe pytest
        env:
          SAFETY_LAB_TRACEFRAME_TESTS: "1"
      - run: uv run --locked safety-lab doctor
      - run: uv run --locked python -m evaluator
      - run: uv build --no-sources
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.6.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_sandbox_integration.py -v
        env:
          SAFETY_LAB_DOCKER_TESTS: "1"
